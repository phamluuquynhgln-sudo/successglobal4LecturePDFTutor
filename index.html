<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>*{box-sizing:border-box}html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><title>English 4 Global Success Ôn Tập</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap">
<style>
/* Layout: sticker-book review — bunting header, unit chips, hero sticker, sticky tab rail, card grids */
:root{
  --ground:#FFF1E3; --ground-2:#FFE0C6; --surface:#FFFFFF; --surface-2:#FFF7EF;
  --ink:#3A2116; --ink-soft:#8A6350; --line:#3A2116; --shadow:rgba(58,33,22,.9);
  --orange:#FF6B1A; --orange-soft:#FFD9BC; --orange-deep:#C24400; --apricot:#FFB44F;
  --pink:#FF4E8A; --pink-soft:#FFDCE8; --mint:#0F9B8E; --mint-soft:#CFF0EC;
  --wrong:#D93025; --wrong-soft:#FFE0DD; --focus:#1D6FE0; --on-accent:#3A2116;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#241610; --ground-2:#2F1D15; --surface:#37241C; --surface-2:#2E1E17;
  --ink:#FFEEE0; --ink-soft:#D9B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange-soft:#5A2C12; --orange-deep:#FF9A5C; --pink-soft:#55203A; --mint:#3CCBBC; --mint-soft:#163F3A;
  --wrong:#FF7B70; --wrong-soft:#4A1F1B; --focus:#7FB0FF; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#241610; --ground-2:#2F1D15; --surface:#37241C; --surface-2:#2E1E17;
  --ink:#FFEEE0; --ink-soft:#D9B49C; --line:#FFCCA3; --shadow:rgba(0,0,0,.75);
  --orange-soft:#5A2C12; --orange-deep:#FF9A5C; --pink-soft:#55203A; --mint:#3CCBBC; --mint-soft:#163F3A;
  --wrong:#FF7B70; --wrong-soft:#4A1F1B; --focus:#7FB0FF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  background-image:radial-gradient(circle at 12% 18%,var(--ground-2) 0 6px,transparent 7px),radial-gradient(circle at 78% 62%,var(--ground-2) 0 5px,transparent 6px),radial-gradient(circle at 45% 85%,var(--orange-soft) 0 4px,transparent 5px);
  background-size:180px 180px,230px 230px,150px 150px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:8px 40px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.bunting{display:block;width:100%;height:34px}
.brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:4px 0 10px}
.brand svg{width:44px;height:34px;flex:none}
.brand b{font-family:var(--display);font-weight:800;color:var(--orange-deep);letter-spacing:.08em;font-size:clamp(18px,4vw,24px)}
.sticker{background:var(--surface);border:2.5px solid var(--line);border-radius:18px;box-shadow:5px 5px 0 var(--shadow)}
.btn{cursor:pointer;background:var(--surface);border:2.5px solid var(--line);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);padding:8px 14px;font-weight:800;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active,.btn.on{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.pri{background:var(--orange);color:#3A2116}
.btn.sel{background:var(--apricot);color:#3A2116}
.btn[disabled]{opacity:.5;cursor:default}
.spk{cursor:pointer;width:42px;height:42px;flex:none;border-radius:50%;border:2.5px solid var(--line);background:var(--orange);color:#3A2116;box-shadow:2px 2px 0 var(--shadow);display:inline-grid;place-items:center;font-size:18px;transition:transform .08s}
.spk.sm{width:32px;height:32px;font-size:14px}
.spk:active,.spk.on{transform:translate(2px,2px);box-shadow:0 0 0 var(--shadow);background:var(--apricot)}
/* unit chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 10px;scrollbar-width:thin}
.chip{flex:none;cursor:pointer;border:2.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-weight:800;font-family:var(--display);box-shadow:2px 2px 0 var(--shadow)}
.chip[aria-current="true"]{background:var(--orange);color:#3A2116}
/* hero */
.hero{padding:18px 20px;margin:6px 0 16px;display:grid;gap:8px;background:linear-gradient(135deg,var(--surface) 60%,var(--orange-soft))}
.hero .k{font-family:var(--display);font-weight:800;color:var(--orange-deep);letter-spacing:.1em;font-size:15px}
.hero h1{font-size:clamp(28px,6vw,44px);font-weight:800}
.hero .vi{color:var(--ink-soft);font-weight:700;font-size:18px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:800;background:var(--surface-2)}
/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 4px;background:var(--ground);margin:0 -4px 12px}
.tab{flex:none;cursor:pointer;border:2.5px solid var(--line);border-radius:14px;padding:7px 14px;font-weight:800;background:var(--surface);box-shadow:3px 3px 0 var(--shadow);font-family:var(--display);font-size:16px}
.tab[aria-selected="true"]{background:var(--orange);color:#3A2116;transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.tab.tutor{background:var(--pink-soft)}
.tab.tutor[aria-selected="true"]{background:var(--pink);color:#3A2116}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 12px}
.sec-h h2{font-size:26px}
.sec-h p{margin:0;color:var(--ink-soft);font-weight:600}
.grp{font-family:var(--display);font-weight:800;font-size:19px;margin:18px 0 10px;color:var(--orange-deep)}
/* vocab */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
@media (max-width:420px){.vgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.vcard{padding:12px;display:flex;flex-direction:column;gap:8px}
.pic{height:86px;display:grid;place-items:center;font-size:48px;border:2.5px dashed var(--ink-soft);border-radius:26px 30px 24px 32px;background:var(--surface-2)}
.vcard .row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.vcard .row>div{min-width:0}
.en{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;overflow-wrap:anywhere}
.ipa{color:var(--ink-soft);font-size:14px}
.vvi{font-weight:700}
.lbl{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink-soft)}
.ex{display:flex;gap:6px;align-items:flex-start;font-size:14px;border-top:2px dotted var(--ground-2);padding-top:6px}
.ex span{flex:1;min-width:0}
.hl{color:var(--orange-deep);font-weight:800}
.cal{width:74px;height:70px;border:2.5px solid var(--line);border-radius:10px;background:var(--surface);position:relative;display:flex;flex-direction:column;overflow:hidden}
.cal i{display:block;height:20px;background:var(--orange)}
.cal b{flex:1;display:grid;place-items:center;font-family:var(--display);font-size:20px}
/* structures */
.slist{display:grid;gap:16px}
.scard{padding:16px;display:grid;gap:10px}
.scard h3{font-size:21px;display:flex;gap:8px;align-items:center}
.formula{border:2.5px dashed var(--ink-soft);border-radius:12px;padding:10px 12px;font-weight:800;font-size:17px;background:var(--surface-2);overflow-wrap:anywhere}
.formula .v{background:var(--orange-soft);border:2px solid var(--orange);border-radius:8px;padding:0 6px;margin:0 2px;display:inline-block}
.tip{background:var(--mint-soft);border-radius:12px;padding:10px 12px;border:2px solid var(--mint)}
.tip b{color:var(--ink)}
.exs{display:grid;gap:8px}
.exl{display:flex;gap:10px;align-items:center}
.exl div{min-width:0}
.exl .e{font-weight:800}
.exl .t{color:var(--ink-soft);font-size:14px}
/* story */
.note{background:var(--surface-2);border:2px dashed var(--ink-soft);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--ink-soft);margin-bottom:10px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;margin-bottom:10px}
.story{padding:14px;display:grid;gap:8px}
.sline{display:flex;gap:10px;align-items:flex-start;padding:6px;border-radius:10px}
.sline.active{background:var(--orange-soft)}
.sline p{margin:0;flex:1;min-width:0;font-size:17px}
b.w{color:var(--orange-deep)}
i.s{font-style:normal;text-decoration:underline dotted var(--mint) 2.5px;text-underline-offset:4px}
.qbox{padding:14px;margin-top:16px;display:grid;gap:12px}
.q{border-bottom:2px dotted var(--ground-2);padding-bottom:10px;display:grid;gap:8px}
.yn{display:flex;gap:8px}
.fb{border-radius:10px;padding:8px 10px;font-size:15px}
.fb.ok{background:var(--mint-soft)}
.fb.no{background:var(--wrong-soft)}
.btn.picked{background:var(--apricot)}
/* practice */
.scorebar{padding:12px 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.scorebar .big{font-family:var(--display);font-weight:800;font-size:22px}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.ex-sec{padding:14px;margin-bottom:18px}
.ex-sec h3{font-size:21px;margin-bottom:4px}
.ex-sec .sub{color:var(--ink-soft);font-size:14px;margin:0 0 10px}
.item{border-top:2px dotted var(--ground-2);padding:10px 0;display:grid;gap:8px}
.item .num{font-weight:800;color:var(--orange-deep)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.opt{cursor:pointer;border:2.5px solid var(--line);border-radius:12px;background:var(--surface);padding:8px;font-weight:700;text-align:center;box-shadow:2px 2px 0 var(--shadow)}
.opt .em{font-size:30px;display:block}
.opt.right{background:var(--mint-soft);border-color:var(--mint)}
.opt.bad{background:var(--wrong-soft);border-color:var(--wrong)}
.opt[disabled]{cursor:default}
.gap{width:11ch;border:2.5px solid var(--line);border-radius:8px;padding:2px 6px;font:inherit;font-weight:700;background:var(--surface);color:var(--ink)}
.gap.right{background:var(--mint-soft)} .gap.bad{background:var(--wrong-soft)}
.tline{width:100%;border:2.5px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--surface);color:var(--ink)}
.words{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.wchip{cursor:pointer;border:2px solid var(--line);border-radius:10px;padding:4px 10px;background:var(--surface-2);font-weight:700}
.answer{min-height:44px;border:2.5px dashed var(--ink-soft);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{font-weight:700;font-size:15px}
.msg.ok{color:var(--mint)} .msg.no{color:var(--wrong)}
/* mistakes */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.mcard{padding:14px;display:grid;gap:8px;align-content:start}
.tag{justify-self:start;background:var(--apricot);color:#3A2116;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;font-weight:800}
.bad-row{background:var(--wrong-soft);border-radius:10px;padding:6px 10px}
.bad-row s{text-decoration-color:var(--wrong);text-decoration-thickness:2px}
.good-row{background:var(--mint-soft);border-radius:10px;padding:6px 10px;display:flex;gap:8px;align-items:center;font-weight:700}
.good-row span{flex:1;min-width:0}
/* flashcards */
.deck{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.prog{height:14px;border:2.5px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden;margin:8px 0 12px}
.prog i{display:block;height:100%;background:var(--orange);transition:width .3s}
.scene{perspective:1400px;max-width:560px;margin:0 auto}
.fcard{position:relative;height:clamp(320px,50vh,420px);transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.25,1);cursor:pointer}
.fcard.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.fcard:not(.flipped) .face.back{pointer-events:none}
.fcard.flipped .face.front{pointer-events:none}
.face .bigem{font-size:72px;line-height:1}
.face .fvi{font-family:var(--display);font-size:clamp(22px,5vw,30px);font-weight:800}
.face .fen{font-family:var(--display);font-size:clamp(24px,6vw,36px);font-weight:800;color:var(--orange-deep);overflow-wrap:anywhere}
.again{background:var(--pink-soft);border:2px solid var(--pink);border-radius:999px;padding:0 10px;font-size:13px;font-weight:800}
.fbtns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.hint{text-align:center;color:var(--ink-soft);font-size:13px;margin-top:8px}
.celebrate{position:relative;overflow:hidden;padding:28px 18px;text-align:center;display:grid;gap:10px;justify-items:center}
.celebrate::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;background-image:radial-gradient(circle,var(--orange) 0 4px,transparent 5px),radial-gradient(circle,var(--pink) 0 3px,transparent 4px),radial-gradient(circle,var(--mint) 0 3px,transparent 4px);background-size:60px 60px,45px 45px,70px 70px;background-position:0 0,20px 15px,35px 30px}
.celebrate>*{position:relative}
.celebrate .cup{font-size:64px}
.celebrate h2{font-size:32px}
.stars{font-size:30px;letter-spacing:4px;color:var(--apricot)}
/* tutor */
.tutor-top{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}
.tutor-top svg{width:76px;height:76px;flex:none}
.bubble{position:relative;flex:1;min-width:0;padding:12px 14px;background:var(--pink-soft)}
.bubble .who{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--pink)}
.bubble p{margin:2px 0 0;font-weight:700}
.trow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.trow .lab{font-weight:800;font-size:14px;min-width:84px}
.tq{padding:16px;display:grid;gap:12px;justify-items:center;text-align:center}
.tq .bigem{font-size:68px;line-height:1}
.dir{background:var(--pink);color:#3A2116;border:2px solid var(--line);border-radius:999px;padding:0 12px;font-size:12px;font-weight:800;letter-spacing:.1em}
.tq .prompt{font-family:var(--display);font-size:clamp(20px,5vw,28px);font-weight:800;overflow-wrap:anywhere}
.topts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;width:100%}
.topt{cursor:pointer;display:flex;gap:10px;align-items:center;text-align:left;border:2.5px solid var(--line);border-radius:14px;background:var(--surface);padding:10px;font-weight:700;box-shadow:3px 3px 0 var(--shadow)}
.topt .L{flex:none;width:30px;height:30px;border-radius:50%;background:var(--apricot);color:#3A2116;display:grid;place-items:center;font-weight:800;border:2px solid var(--line)}
.topt span.tx{flex:1;min-width:0}
.topt.right{background:var(--mint-soft);border-color:var(--mint)}
.topt.bad{background:var(--wrong-soft);border-color:var(--wrong)}
.aud{display:flex;gap:8px;align-items:center;border:2.5px solid var(--line);border-radius:14px;padding:8px;background:var(--surface)}
.aud.right{background:var(--mint-soft)} .aud.bad{background:var(--wrong-soft)}
.aud .tx{flex:1;min-width:0;font-weight:700;text-align:left}
.tstat{font-size:14px;font-weight:700;color:var(--ink-soft);text-align:center}
.novoice{display:none;background:var(--wrong-soft);border:2px solid var(--wrong);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.novoice.show{display:block}
footer{margin-top:30px;text-align:center;font-size:13px;color:var(--ink-soft);display:grid;gap:4px}
footer b{font-family:var(--display);color:var(--orange-deep);letter-spacing:.08em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.whsub{margin:-4px 0 0;color:var(--ink-soft);font-size:14px;font-weight:600}
.whopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.whopts .btn{text-align:left;font-weight:700;display:flex;gap:8px;align-items:center}
.whopts .wl{flex:none;width:26px;height:26px;border-radius:50%;background:var(--apricot);color:#3A2116;border:2px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:13px}
.whopts .btn[disabled]{opacity:.55}.whopts .btn.right,.whopts .btn.bad{opacity:1}
.whopts .btn.right{background:var(--mint-soft);border-color:var(--mint)}
.whopts .btn.bad{background:var(--wrong-soft);border-color:var(--wrong)}
/* ===== PDF export ===== */
.pdfbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 14px}
.pdfbar .btn{font-size:15px;padding:6px 12px}
.pdfmsg{font-weight:700;color:var(--ink-soft);font-size:14px}
.pdfmsg.err{color:var(--wrong)}
.fixed-note{display:inline-block;background:var(--mint-soft);border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:13px;font-weight:800;color:var(--ink);margin-left:6px}
.pdfroot{position:absolute;left:-30000px;top:0;width:760px;background:#fff;color:#3A2116;font-family:var(--body);font-size:13px;line-height:1.4}
.pdfroot *{box-shadow:none!important}
.pdfroot .pdfsec{padding:0 0 10px;background:#fff}
.pdfroot .pdftop{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2.5px solid #3A2116;padding:2px 0 6px;margin-bottom:4px}
.pdfroot .pdftop b{font-family:var(--display);font-weight:800;letter-spacing:.08em;color:#C24400;font-size:17px;display:block}
.pdfroot .pdftop small{font-weight:700;color:#8A6350;font-size:12px}
.pdfroot .pdftop .nm{font-weight:700;white-space:nowrap}
.pdfroot .pdfsec-h{font-family:var(--display);font-weight:800;font-size:19px;color:#C24400;border-bottom:2.5px solid #FF6B1A;padding:6px 0 1px;margin:0 0 6px}
.pdfroot .pg{font-family:var(--display);font-weight:800;font-size:14px;color:#3A2116;margin:6px 0 3px}
.pdfroot table.pt{width:100%;border-collapse:collapse;table-layout:fixed}
.pdfroot table.pt th{background:#FFD9BC;text-align:left;font-size:12px;padding:3px 5px;border:1px solid #C9A58E}
.pdfroot table.pt td{padding:3px 5px;border:1px solid #E3CBBB;vertical-align:top;overflow-wrap:anywhere}
.pdfroot table.pt td.e{font-size:16px;text-align:center}
.pdfroot table.pt td.w{font-weight:800}
.pdfroot table.pt td.i{color:#8A6350;font-size:12px}
.pdfroot .hl{color:#C24400;font-weight:800}
.pdfroot .pst{border:1.5px solid #E3CBBB;border-radius:8px;padding:6px 9px;margin-bottom:6px}
.pdfroot .pst b.t{font-family:var(--display);font-size:15px}
.pdfroot .pf{background:#FFF7EF;border:1.5px dashed #3A2116;border-radius:6px;padding:2px 8px;margin:4px 0;font-weight:800}
.pdfroot .pf .v{color:#C24400}
.pdfroot .ptip{font-size:12.5px;margin:2px 0}
.pdfroot .pex{display:grid;grid-template-columns:1fr 1fr;gap:1px 12px;font-size:12.5px;margin-top:2px}
.pdfroot .pex .vi{color:#8A6350}
.pdfroot .psl{padding:2px 0;font-size:20px;line-height:1.5}
.pdfroot .pstory{border:1.5px solid #E3CBBB;border-radius:10px;padding:8px 14px;margin-bottom:8px}
.pdfroot .pgb{font-family:var(--display);font-weight:800;font-size:19px;color:#3A2116;margin:8px 0 2px}
.pdfroot .pq.big{font-size:17px;padding:4px 0}
.pdfroot .pq.big span.c{font-size:17px;letter-spacing:.05em}
.pdfroot .pwh{padding:4px 0 2px;font-size:17px;font-weight:700}
.pdfroot .pwh .ln{height:24px;border-bottom:1.5px solid #3A2116;margin-top:2px}
.pdfroot .pnote.big{font-size:13px}
.pdfroot .tight .psl{font-size:18px;line-height:1.4}.pdfroot .tight .pq.big,.pdfroot .tight .pwh{font-size:16px}.pdfroot .tight .pwh .ln{height:20px}.pdfroot .tight .pgb{margin-top:6px}
.pdfroot .psl b.w{background:#FFD9BC;border-radius:4px;padding:0 3px;white-space:nowrap}

"Who's that? – It's Ben.", "Đó là ai? – Đó là Ben."]]}, {"em": "🙋", "ti": "Giới thiệu bản thân", "f": "I'm {Minh}. I'm {nine} years old.", "ex": "<b>I'm</b> = I am. Nói tên rồi nói <b>tuổi</b>: I'm + số + <b>years old</b>.", "p": [["Hello. I'm Minh. I'm from Viet Nam.", "Xin chào. Mình là Minh. Mình đến từ Việt Nam."], ["I am nine years old.", "Mình chín tuổi."], ["Hi. My name is Lucy.", "Chào. Tên mình là Lucy."]]}, {"em": "👫", "ti": "Giới thiệu bạn của em", "f": "This is my friend, {Tony}. {He} is from {America}.", "ex": "<b>This is</b> = Đây là. Sau đó dùng <b>He is</b> (bạn trai) hoặc <b>She is</b> (bạn gái).", "p": [["This is my friend, Tony. He is from America.", "Đây là bạn mình, Tony. Bạn ấy đến từ nước Mỹ."], ["This is my friend, Laura. She is from Australia.", "Đây là bạn mình, Laura. Bạn ấy đến từ nước Úc."], ["I have two new friends, Tony and Laura.", "Mình có hai người bạn mới, Tony và Laura."]]}, {"em": "😊", "ti": "Nói bạn bè như thế nào", "f": "{They} are {friendly}.", "ex": "Nhiều người dùng <b>They are</b>, một người dùng <b>He is / She is</b>.", "p": [["They are friendly.", "Các bạn ấy thân thiện."], ["Tony is friendly.", "Tony thân thiện."], ["My new friends are friendly.", "Những người bạn mới của mình rất thân thiện."]]}, {"em": "🔤", "ti": "Động từ to be: am / is / are", "f": "I {am} · He / She / Anna {is} · You / We / They {are}", "ex": "<b>I</b> đi với <b>am</b>; <b>một người</b> (he, she, tên 1 bạn) đi với <b>is</b>; <b>you, we, they</b> hoặc từ 2 người trở lên đi với <b>are</b>.", "p": [["I am from Viet Nam.", "Mình đến từ Việt Nam."], ["Anna is from Japan.", "Anna đến từ Nhật Bản."], ["They are from Korea.", "Họ đến từ Hàn Quốc."]]}, {"em": "🪪", "ti": "Nói quốc tịch", "f": "I am from {America}, so I am {American}.", "ex": "Tên <b>nước</b> đứng sau <b>from</b>. <b>Quốc tịch</b> đứng sau <b>am / is / are</b>: Japan → Japanese, Britain → British, Thailand → Thai.", "p": [["I am from America, so I am American.", "Mình đến từ nước Mỹ, nên mình là người Mỹ."], ["She is from Britain, so she is British.", "Bạn ấy đến từ nước Anh, nên bạn ấy là người Anh."], ["What nationality is he? – He is Japanese.", "Bạn ấy quốc tịch gì? – Bạn ấy là người Nhật."]]}], "storyNote": "Bài đọc lấy từ tài liệu Reading Comprehension – Unit 1 (cô gửi kèm), chỉ sửa nhẹ chính tả. Bài đọc và câu hỏi được giữ cố định: mở lại hay xuất PDF lúc nào cũng đúng bài này.", "story": ["<i class='s'>My name is Nam. I'm <b class='w'>from</b> <b class='w'>Viet Nam</b></i>. I'm 10 years old now.", "I have many <b class='w'>friends</b>. They are from <b class='w'>different</b> countries.", "I have a friend. His name is Tom. <i class='s'>He's from <b class='w'>Thailand</b></i>.", "Thailand is a country in <b class='w'>Southeast Asia</b>. They have tasty food like pad Thai!", "I also have a friend named Yuki. <i class='s'>He's from <b class='w'>Japan</b></i>.", "Japan is in East Asia, and they have beautiful <b class='w'>cherry blossoms</b>.", "<i class='s'>My friend Sarah is from <b class='w'>Britain</b></i>. Britain is in <b class='w'>Europe</b>. They speak English there.", "Lastly, I have a friend named Emily. <i class='s'>She's from <b class='w'>America</b></i>.", "America is a big country in North America. They have famous cities like New York.", "It's great to have friends from different countries.", "We learn about their cultures and have fun together."], "qs": [["Is Nam from Japan?", "N", "No, he isn't. He's from Viet Nam.", "My name is Nam. I'm from Viet Nam.", "Nam đến từ Việt Nam, không phải Nhật Bản."], ["Is Tom from Thailand?", "Y", "Yes, he is. He's from Thailand.", "His name is Tom. He's from Thailand.", "Tom đến từ Thái Lan – một nước ở Đông Nam Á."], ["Is Emily from America?", "Y", "Yes, she is. She's from America.", "Lastly, I have a friend named Emily. She's from America.", "Emily đến từ nước Mỹ, nơi có thành phố New York."], ["Do people in Britain speak French?", "N", "No, they don't. They speak English there.", "Britain is in Europe. They speak English there.", "Ở nước Anh người ta nói tiếng Anh."], ["Is it boring to have friends from different countries?", "N", "No, it isn't. It's great!", "It's great to have friends from different countries.", "Có bạn từ nhiều nước thật tuyệt, không hề chán."]], "mcq": [["Where ___ you from?", ["are", "is", "am"], 0, "Với you dùng are."], ["I'm ___ Viet Nam.", ["from", "in", "at"], 0, "Nói đến từ nước nào: from + tên nước."], ["Where's ___ from? – She's from Japan.", ["she", "he", "you"], 0, "Câu trả lời là She's nên câu hỏi dùng she."], ["___ that? – It's my new friend.", ["Who's", "Where's", "What time"], 0, "Hỏi ai dùng Who."], ["He's from ___.", ["Malaysia", "nine", "friendly"], 0, "Sau from là tên nước."], ["Tony ___ from America.", ["is", "are", "am"], 0, "Một bạn (Tony) dùng is."], ["I ___ nine years old.", ["am", "is", "are"], 0, "I đi với am."], ["They ___ friendly.", ["are", "is", "am"], 0, "They đi với are."], ["Where's he from? – ___ from Australia.", ["He's", "She's", "I'm"], 0, "Hỏi he thì trả lời He's."], ["This is my friend, Laura. ___ is from Australia.", ["She", "He", "They"], 0, "Laura là bạn gái nên dùng She."], ["They ___ from Korea.", ["are", "is", "am"], 0, "They đi với are."], ["Anna ___ from Japan.", ["is", "are", "am"], 0, "Anna là một bạn → is."], ["___ she from Britain?", ["Is", "Are", "Am"], 0, "Câu hỏi với she → Is she …?"], ["___ you from Thailand?", ["Are", "Is", "Am"], 0, "Câu hỏi với you → Are you …?"], ["Where ___ Julia and Ana from?", ["are", "is", "am"], 0, "Hai bạn (số nhiều) → are."], ["She is from Britain, so she is ___.", ["British", "Britain", "England"], 0, "Quốc tịch của người nước Anh là British."], ["He is from Japan, so he is ___.", ["Japanese", "Japan", "Japans"], 0, "Quốc tịch của người Nhật là Japanese."], ["We ___ from Viet Nam.", ["are", "is", "am"], 0, "We đi với are."], ["What ___ is she? – She is Vietnamese.", ["nationality", "country", "name"], 0, "Hỏi quốc tịch: What nationality …?"], ["Sarah is from Britain. Britain is in ___.", ["Europe", "Asia", "America"], 0, "Theo bài đọc: Britain is in Europe."]], "qw": [["I'm from Viet Nam.", ["Where are you from?"]], ["She's from Japan.", ["Where is she from?"]], ["He's from Singapore.", ["Where is he from?"]], ["It's my new friend.", ["Who is that?", "Who is this?"]], ["I am nine years old.", ["How old are you?"]], ["Tony is from America.", ["Where is Tony from?", "Where is he from?"]], ["Laura is from Australia.", ["Where is Laura from?", "Where is she from?"]], ["Lucy is from Britain.", ["Where is Lucy from?", "Where is she from?"]], ["My name is Minh.", ["What is your name?"]], ["He's from Malaysia.", ["Where is he from?"]], ["He is Japanese.", ["What nationality is he?"]], ["They are from Brazil.", ["Where are they from?"]], ["She is from Thailand.", ["Where is she from?"]]], "mistakes": [["from", "I'm Viet Nam.", "I'm from Viet Nam.", "Nói mình đến từ nước nào phải có <b>from</b>."], ["are", "Where is you from?", "Where are you from?", "Với <b>you</b> luôn dùng <b>are</b>."], ["he / she", "Where's he from? – She's from Japan.", "Where's he from? – He's from Japan.", "Hỏi <b>he</b> (bạn trai) thì trả lời <b>He's</b>."], ["viết hoa", "I'm from japan.", "I'm from Japan.", "Tên nước luôn <b>viết hoa</b> chữ cái đầu."], ["am", "I nine years old.", "I am nine years old.", "Phải có <b>am</b> sau <b>I</b>."], ["Who / Where", "Where's that? – It's my new friend.", "Who's that? – It's my new friend.", "Hỏi <b>ai</b> dùng <b>Who</b>, hỏi <b>ở đâu</b> dùng <b>Where</b>."], ["They are", "They is friendly.", "They are friendly.", "<b>They</b> đi với <b>are</b>."], ["America", "I'm from American.", "I'm from America.", "<b>America</b> là tên nước; <b>American</b> là người Mỹ."], ["is / are", "We is from Viet Nam.", "We are from Viet Nam.", "<b>We / You / They</b> luôn đi với <b>are</b>."], ["Quốc tịch", "She is from Britain, so she is Britain.", "She is from Britain, so she is British.", "Sau <b>so she is</b> phải là <b>quốc tịch</b>: British, American, Japanese…"], ["Trật tự câu hỏi", "Where you are from?", "Where are you from?", "Câu hỏi: <b>Where + are / is + chủ ngữ + from?</b>"]]});
UNITS.push({"n": 2, "en": "Time and daily routines", "vi": "Giờ giấc và hoạt động hằng ngày", "pages": "16–21", "vocab": [{"g": "Telling the time – Nói giờ", "w": [["time", "/taɪm/", "thời gian, giờ", "⏰", "What time is it?"], ["o'clock", "/əˈklɒk/", "giờ đúng", "clk:6:00", "It's six o'clock."], ["six fifteen", "/sɪks ˌfɪfˈtiːn/", "sáu giờ mười lăm", "clk:6:15", "I have breakfast at six fifteen."], ["six thirty", "/sɪks ˈθɜːti/", "sáu giờ ba mươi (6 rưỡi)", "clk:6:30", "I get up at six thirty."], ["six forty-five", "/sɪks ˌfɔːti ˈfaɪv/", "sáu giờ bốn mươi lăm", "clk:6:45", "I go to school at six forty-five."], ["eight thirty", "/eɪt ˈθɜːti/", "tám giờ ba mươi", "clk:8:30", "It's eight thirty."], ["three fifteen", "/θriː ˌfɪfˈtiːn/", "ba giờ mười lăm", "clk:3:15", "It's three fifteen."], ["nine forty-five", "/naɪn ˌfɔːti ˈfaɪv/", "chín giờ bốn mươi lăm", "clk:9:45", "I go to bed at nine forty-five."]]}, {"g": "Daily routines – Hoạt động hằng ngày", "w": [["get up", "/ɡet ʌp/", "thức dậy", "🌅", "I get up at six o'clock."], ["wash my face", "/wɒʃ maɪ feɪs/", "rửa mặt", "🧼", "I wash my face."], ["clean my teeth", "/kliːn maɪ tiːθ/", "đánh răng", "🦷", "I clean my teeth."], ["have breakfast", "/hæv ˈbrekfəst/", "ăn sáng", "🥣", "What time do you have breakfast?"], ["go to school", "/ɡəʊ tə skuːl/", "đi học", "🏫", "I go to school at seven o'clock."], ["have a break", "/hæv ə breɪk/", "nghỉ giải lao", "🛝", "Let's have a break."], ["go into the classroom", "/ɡəʊ ˈɪntə ðə ˈklɑːsruːm/", "vào lớp học", "🚪", "Let's go into the classroom."], ["have lunch", "/hæv lʌntʃ/", "ăn trưa", "🍱", "I have lunch at school."], ["have dinner", "/hæv ˈdɪnə/", "ăn tối", "🍲", "I have dinner at seven thirty."], ["do my homework", "/duː maɪ ˈhəʊmwɜːk/", "làm bài tập về nhà", "📝", "I do my homework."], ["watch TV", "/wɒtʃ ˌtiː ˈviː/", "xem ti vi", "📺", "I watch TV with my dad."], ["read a book", "/riːd ə bʊk/", "đọc sách", "📖", "I read a book."], ["chat with my friends", "/tʃæt wɪð maɪ frendz/", "trò  "Bạn thức dậy lúc mấy giờ? – Mình dậy lúc sáu giờ."], ["What time do you have breakfast? – I have breakfast at six fifteen.", "Bạn ăn sáng lúc mấy giờ? – Mình ăn sáng lúc sáu giờ mười lăm."], ["What time do you go to bed? – I go to bed at nine forty-five.", "Bạn đi ngủ lúc mấy giờ? – Mình đi ngủ lúc chín giờ bốn mươi lăm."]]}, {"em": "🙌", "ti": "Rủ bạn cùng làm", "f": "Let's {have a break}.", "ex": "<b>Let's</b> + hoạt động = Chúng mình cùng … nhé!", "p": [["Let's have a break.", "Chúng mình nghỉ giải lao nhé."], ["Let's go into the classroom.", "Chúng mình vào lớp nhé."], ["Let's go to school.", "Chúng mình đi học nhé."]]}, {"em": "🔁", "ti": "Hỏi lại bạn: Còn bạn?", "f": "I get up at {six o'clock}. And you? – At {five forty-five}.", "ex": "<b>And you?</b> = Còn bạn thì sao? Trả lời ngắn: <b>At</b> + giờ.", "p": [["I get up at six o'clock. And you? – At five forty-five.", "Mình dậy lúc sáu giờ. Còn bạn? – Lúc năm giờ bốn mươi lăm."], ["I have breakfast at six thirty. And you? – At six fifteen.", "Mình ăn sáng lúc sáu rưỡi. Còn bạn? – Lúc sáu giờ mười lăm."], ["I go to bed at nine o'clock. And you? – At nine thirty.", "Mình đi ngủ lúc chín giờ. Còn bạn? – Lúc chín rưỡi."]]}, {"em": "📋", "ti": "Kể các việc theo thứ tự", "f": "I {wash my face} and {clean my teeth}. Then I {have breakfast}.", "ex": "Dùng <b>and</b> để nối 2 việc, <b>Then</b> = sau đó.", "p": [["I wash my face and clean my teeth.", "Mình rửa mặt và đánh răng."], ["Then I have breakfast at six fifteen.", "Sau đó mình ăn sáng lúc sáu giờ mười lăm."], ["I do my homework and go to bed.", "Mình làm bài tập rồi đi ngủ."]]}, {"em": "🚲", "ti": "Hỏi cách đi học", "f": "How do you go to school? – I go to school {by bike}.", "ex": "<b>How</b> = bằng cách nào. Trả lời: <b>by</b> + phương tiện (by bike, by bus, by car) hoặc <b>I walk to school</b> (đi bộ).", "p": [["How do you go to school? – I go to school by bike.", "Bạn đi học bằng gì? – Mình đi học bằng xe đạp."], ["We go to school by bus.", "Chúng mình đi học bằng xe buýt."], ["I walk to school.", "Mình đi bộ đến trường."]]}], "storyNote": "Bài đọc lấy từ tài liệu Reading Comprehension – Unit 2 (cô gửi kèm), chỉ sửa nhẹ chính tả. Bài đọc và câu hỏi được giữ cố định: mở lại hay xuất PDF lúc nào cũng đúng bài này.", "story": ["Every morning, we all wake up to start our day.", "<i class='s'>I often <b class='w'>get up</b> at <b class='w'>six thirty</b> in the morning</i>.", "After I get up, it's time to <b class='w'>have breakfast</b>.", "It's important to have a <b class='w'>healthy</b> breakfast to start our day.", "<i class='s'>I always have breakfast at around seven o'clock or seven thirty</i>.", "After breakfast, it's time to get ready for school.", "I <b class='w'>clean my teeth</b>, <b class='w'>wash my face</b> and <b class='w'>get dressed</b>.", "At around eight o'clock or <b class='w'>eight thirty</b>, it's time to <b class='w'>go to school</b>.", "I often <b class='w'>ride my bike</b> to get there.", "At school, I learn maths, science, reading and many other subjects.", "I have breaks and lunchtime to rest and have some fun with my friends.", "After a busy day at school, it's time to <b class='w'>go home</b>.", "I have some free time to play, <b class='w'>do my homework</b> or help my parents with <b class='w'>chores</b>.", "In the evening, I am ready for bedtime.", "<i class='s'>I often <b class='w'>read a book</b> before I <b class='w'>go to bed</b> at around nine o'clock</i>."], "qs": [["Do you get up at six thirty every morning?", "Y", "Yes, I do. I get up at six thirty.", "I often get up at six thirty in the morning.", "Bạn nhỏ trong bài thức dậy lúc 6 giờ 30."], ["Do you walk to school every day?", "N", "No, I don't. I often ride my bike to school.", "I often ride my bike to get there.", "Bạn ấy thường đạp xe đến trường, không đi bộ."], ["Do you learn maths, science and reading at school?", "Y", "Yes, I do.", "At school, I learn maths, science, reading and many other subjects.", "Ở trường bạn ấy học toán, khoa học, đọc và nhiều môn khác."], ["Do you go to bed at ten o'clock?", "N", "No, I don't. I go to bed at around nine o'clock.", "I often read a book before I go to bed at around nine o'clock.", "Bạn ấy đi ngủ khoảng 9 giờ, không phải 10 giờ."], ["Do you help your parents with chores?", "Y", "Yes, I do. I help my parents with chores.", "I have some free time to play, do my homework or help my parents with chores.", "Sau giờ học bạn ấy giúp bố mẹ làm việc nhà."]], "mcq": [["What time ___ it?", ["is", "are", "do"], 0, "What time is it? – dùng is."], ["It's six ___. (6:00)", ["o'clock", "fifteen", "thirty"], 0, "Giờ đúng dùng o'clock."], ["It's three ___. (3:15)", ["fifteen", "thirty", "forty-five"], 0, "3:15 đọc là three fifteen."], ["What time do you ___ up?", ["get", "go", "have"], 0, "Thức dậy là get up."], ["I have breakfast ___ six fifteen.", ["at", "in", "on"], 0, "Trước giờ dùng at."], ["I go ___ bed at nine forty-five.", ["to", "at", "in"], 0, "Đi ngủ là go to bed."], ["Let's ___ a break.", ["have", "go", "get"], 0, "Nghỉ giải lao là have a break."], ["What time ___ you go to school?", ["do", "are", "is"], 0, "Hỏi về việc làm dùng do you."], ["I ___ my face and clean my teeth.", ["wash", "have", "go"], 0, "Rửa mặt là wash my face."], ["I ___ my homework.", ["do", "make", "have"], 0, "Làm bài tập là do my homework."], ["I get up ___ six o'clock every morning.", ["at", "on", "in"], 0, "Trước giờ dùng at."], ["I ___ to school by bus.", ["go", "goes", "going"], 0, "Chủ ngữ I → go (không thêm s)."], ["What time ___ you get up?", ["do", "does", "are"], 0, "What time do you …?"], ["I ___ breakfast at seven o'clock.", ["have", "has", "having"], 0, "I → have."], ["What time ___ it? – It's ten fifteen.", ["is", "are", "do"], 0, "What time is it?"], ["We go to school ___ bus.", ["by", "on", "at"], 0, "Phương tiện: by bus, by bike, by car."], ["I go ___ at five o'clock.", ["home", "to home", "the home"], 0, "go home – không có to."], ["I go to ___ at ten o'clock.", ["bed", "the bed", "beds"], 0, "Đi ngủ: go to bed."], ["I have lunch ___ twelve o'clock.", ["at", "on", "in"], 0, "Trước giờ dùng at."], ["After breakfast, I clean my teeth, wash my face and get ___.", ["dressed", "dress", "dressing"], 0, "get dressed = mặc quần áo (theo bài đọc)."]], "qw": [["It's eight thirty.", ["What time is it?"]], ["I get up at six o'clock.", ["What time do you get up?"]], ["I have breakfast at six fifteen.", ["What time do you have breakfast?"]], ["I go to school at seven o'clock.", ["What time do you go to school?"]], ["I go to bed at nine forty-five.", ["What time do you go to bed?"]], ["I have dinner at seven thirty.", ["What time do you have dinner?"]], ["It's three fifteen.", ["What time is it?"]], ["I have lunch at eleven o'clock.", ["What time do you have lunch?"]], ["I do my homework at eight o'clock.", ["What time do you do your homework?", "What time do you do homework?"]], ["I watch TV at eight thirty.", ["What time do you watch TV?"]], ["I go to school by bike.", ["How do you go to school?"]], ["I go home at five o'clock.", ["What time do you go home?", "When do you go home?"]], ["It's ten fifteen.", ["What time is it?"]]], "mistakes": [["at", "I get up in six o'clock.", "I get up at six o'clock.", "Trước giờ dùng <b>at</b>."], ["o'clock", "It's six thirty o'clock.", "It's six thirty.", "Chỉ dùng <b>o'clock</b> với <b>giờ đúng</b> (6:00, 7:00…)."], ["do you", "What time you get up?", "What time do you get up?", "Câu hỏi cần có <b>do</b> trước <b>you</b>."], ["It's", "What time is it? – Is six o'clock.", "What time is it? – It's six o'clock.", "Trả lời giờ phải bắt đầu bằng <b>It's</b>."], ["go to bed", "I go to the bed at nine o'clock.", "I go to bed at nine o'clock.", "Nói <b>go to bed</b>, không có <b>the</b>."], ["go to school", "I go to the school at seven o'clock.", "I go to school at seven o'clock.", "Đi học là <b>go to school</b>, không có <b>the</b>."], ["clean my teeth", "I wash my teeth.", "I clean my teeth.", "Đánh răng: sách dùng <b>clean my teeth</b>."], ["go home", "I go to home at five o'clock.", "I go home at five o'clock.", "<b>go home</b> không có <b>to</b>."], ["I + V", "I goes to school by bus.", "I go to school by bus.", "Chủ ngữ <b>I</b> → động từ <b>không thêm s</b>."], ["What time is it?", "What time it is?", "What time is it?", "Câu hỏi: <b>is</b> đứng trước <b>it</b>."]]});

/b></i>. In IT class, we learn about <b class='w'>computers</b> and technology.", "We explore cool apps and even do some coding. IT helps us understand the digital world we live in.", "In <b class='w'>English</b> class, we read, write and speak in English.", "It's exciting to read stories, write our own pieces and talk in English.", "English helps us talk with people from different places.", "<i class='s'><b class='w'>Art</b> is also one of my <b class='w'>favourite</b> subjects because I get to be creative</i> and make beautiful paintings.", "Art lets us show our imagination and feelings.", "<b class='w'>Maths</b> is all about numbers, shapes and problem-solving.", "We solve puzzles and find answers. Maths helps us think logically.", "PE, IT, English, art or maths – we all have different reasons for loving our favourite subjects.", "They make learning fun and enjoyable."], "qs": [["Does PE keep us fit and healthy?", "Y", "Yes, it does.", "PE keeps us fit and healthy.", "Môn Thể dục giúp chúng ta khoẻ mạnh."], ["Do you learn about animals in IT class?", "N", "No, I don't. I learn about computers and technology.", "In IT class, we learn about computers and technology.", "Môn Tin học học về máy tính và công nghệ."], ["Do you speak English in English class?", "Y", "Yes, I do. We read, write and speak in English.", "In English class, we read, write and speak in English.", "Trong giờ Tiếng Anh các bạn đọc, viết và nói tiếng Anh."], ["Does art help us think logically?", "N", "No, it doesn't. Maths helps us think logically.", "Maths helps us think logically.", "Môn Toán giúp suy nghĩ logic, không phải Mĩ thuật."], ["Is art one of your favourite subjects?", "Y", "Yes, it is.", "Art is also one of my favourite subjects because I get to be creative.", "Mĩ thuật là một môn yêu thích của bạn ấy."]], "mcq": [["What's your ___ subject? – It's PE.", ["favourite", "like", "because"], 0, "Môn yêu thích nhất: favourite subject."], ["___ do you like English?", ["Why", "What", "When"], function allSents(u){var a=[];u.structs.forEach(function(s,si){s.p.forEach(function(p){a.push({en:p[0],vi:p[1],em:s.em,sid:si})})});return a}

function buildChips(){
  $("#chips").innerHTML=UNITS.map(function(u,i){return '<button class="chip" data-u="'+i+'">'+esc(LAB(u))+'</button>'}).join("");
  $$("#chips .chip").forEach(function(c){c.onclick=function(){openUnit(+c.getAttribute("data-u"),true)}});
}
function buildTabs(){
  $("#tabs").innerHTML=TABS.map(function(t,i){return '<button class="tab'+(t[0]==="tutor"?" tutor":"")+'" role="tab" id="tab-'+t[0]+'" aria-controls="p-'+t[0]+'" aria-selected="false" tabindex="-1">'+t[1]+'</button>'}).join("");
  $("#panels").innerHTML=TABS.map(function(t){return '<section role="tabpanel" id="p-'+t[0]+'" aria-labelledby="tab-'+t[0]+'" hidden></section>'}).join("");
  $$("#tabs .tab").forEach(function(b,i){
    b.onclick=function(){selectTab(i)};
    b.onkeydown=function(e){if(e.key==="ArrowRight"||e.key==="ArrowLeft"){e.preventDefault();var n=(i+(e.key==="ArrowRight"?1:-1)+TABS.length)%TABS.length;selectTab(n);$$("#tabs .tab")[n].focus()}};
  });
}
function selectTab(i){
  stopAll();tabIdx=i;
  $$("#tabs .tab").forEach(function(b,j){b.setAttribute("aria-selected",j===i?"true":"false");b.tabIndex=j===i?0:-1});
  TABS.forEach(function(t,j){$("#p-"+t[0]).hidden=j!==i});
  var pt=$("#pdfTab");if(pt)pt.hidden=(TABS[i][0]==="flash"||TABS[i][0]==="tutor");
  if(TABS[i][0]==="flash"&&!FC.q)startFlash(FC.deck||"w");
  if(TABS[i][0]==="tutor"&&!TT.started)startTutor();
}
function openUnit(i,scroll){
  stopAll();cur=i;U=UNITS[i];
  try{localStorage.setItem("qec4-unit",String(i))}catch(e){}
  try{history.replaceState(null,"","#u"+U.n)}catch(e){}
  $$("#chips .chip").forEach(function(c,j){c.setAttribute("aria-current",j===i?"true":"false")});
  var w=allWords(U).length;
  $("#hero").innerHTML='<div class="k">'+esc(LAB(U).toUpperCase())+'</div><h1>'+esc(U.en)+'</h1><div class="vi">'+esc(U.vi)+'</div><div class="pills"><span class="pill">'+w+' từ vựng</span><span class="pill">'+U.structs.length+' mẫu câu</span><span class="pill">SGK trang '+esc(U.pages)+'</span></div>';
  renderVocab();renderStruct();renderStory();renderPractice();renderMist();
  FC={deck:FC.deck||"w"};startFlash(FC.deck);
  TT.started=false;startTutor();
  $("#foot").innerHTML='<b>QUEEN ENGLISH CENTER</b><span>Nguồn: Tiếng Anh 4 – Global Success, '+esc(LAB(U))+' “'+esc(U.en)+'”, SGK trang '+esc(U.pages)+(U.n?'; Bài tập bổ trợ Tiếng Anh 4 Global Success '+esc(LAB(U))+'; bài đọc Reading Comprehension '+esc(LAB(U))+'.':'.')+'</span><span>'+(U.n?'Story là bài đọc cố định từ tài liệu Reading Comprehension. ':'')+'Ví dụ và bài luyện do Claude soạn theo từ vựng, ngữ pháp của unit; phần Luyện tập cố định cho mỗi unit. Giọng đọc là giọng có sẵn trên máy, chất lượng tùy thiết bị.</span>';
  selectTab(tabIdx);
  if(scroll){var c=$("#chips .chip[aria-current=true]");if(c&&c.scrollIntoView)c.scrollIntoView({block:"nearest",inline:"center"})}
}

/* ---------- 1 vocab ---------- */
function hlWord(ex,w){return esc(ex).replace(wordRe(esc(w)),function(m,a,b){return a+'<span class="hl">'+b+'</span>'})}
function renderVocab(){
  var h='<div class="sec-h"><h2>Từ vựng</h2><p>Bấm 🔊 để nghe từ và câu ví dụ.</p></div>';
  U.vocab.forEach(function(g){
    h+='<div class="grp">'+esc(g.g)+'</div><div class="vgrid">';
    g.w.forEach(function(w){
      h+='<article class="vcard sticker"><div class="pic">'+pic(w[3])+'</div><div class="row"><div><div class="en">'+esc(w[0])+'</div><div class="ipa">'+esc(w[1])+'</div></div>'+spk(w[0],false,0.7)+'</div><div class="vvi">'+esc(w[2])+'</div><div class="lbl">VÍ DỤ</div><div class="ex"><span>'+hlWord(w[4],w[0])+'</span>'+spk(w[4],true,0.8)+'</div></article>';
    });
    h+='</div>';
  });
  $("#p-vocab").innerHTML=h;
}
/* ---------- 2 structures ---------- */
function fml(f){return esc(f).replace(/\{([^}]+)\}/g,'<span class="v">$1</span>')}
function renderStruct(){
  var h='<div class="sec-h"><h2>Cấu trúc câu</h2><p>'+U.structs.length+' mẫu câu quan trọng của unit.</p></div><div class="slist">';
  U.structs.forEach(function(s){
    h+='<article class="scard sticker"><h3><span aria-hidden="true">'+esc(s.em)+'</span>'+esc(s.ti)+'</h3><div class="formula">'+fml(s.f)+'</div><div class="tip">💡 '+s.ex+'</div><div class="lbl">VÍ DỤ</div><div class="exs">';
    s.p.forEach(function(p){h+='<div class="exl">'+spk(p[0],true)+'<div><div class="e">'+esc(p[0])+'</div><div class="t">'+esc(p[1])+'</div></div></div>'});
    h+='</div></article>';
  });
  $("#p-struct").innerHTML=h+'</div>';
}
/* ---------- 3 story ---------- */
function renderStory(){
  var h='<div class="sec-h"><h2>Story</h2><button class="btn pri spkall" id="playall">▶ Nghe cả bài</button></div><div class="note">'+esc(U.storyNote)+'</div><div class="legend"><span><b class="w">cam</b> = từ vựng</span><span><i class="s">gạch chấm xanh</i> = cấu trúc</span></div><div class="story sticker">';
  U.story.forEach(function(l){h+='<div class="sline" data-say="'+esc(strip(l))+'">'+spk(l,true)+'<p>'+l+'</p></div>'});
  h+='</div><div class="qbox sticker"><h3>Trả lời Yes / No <span id="ynscore" class="pill">★ 0/'+U.qs.length+'</span></h3>';
  U.qs.forEach(function(q,i){h+='<div class="q" data-i="'+i+'"><div class="acts">'+spk(q[0],true)+'<b>'+(i+1)+'. '+esc(q[0])+'</b></div><div class="yn"><button class="btn" data-a="Y">YES</button><button class="btn" data-a="N">NO</button></div><div class="fbx"></div></div>'});
  h+='<div><button class="btn" id="ynreset">🔁 Làm lại</button></div></div>';
  var wh=WH[String(U.n)]||[];
  if(wh.length){
    var WR=seedRand("qec4-wh-u"+U.n);
    h+='<div class="qbox sticker" id="whbox"><h3>Trả lời câu hỏi Wh- <span id="whscore" class="pill">★ 0/'+wh.length+'</span></h3><p class="whsub">Đọc story, chọn câu trả lời đúng cho mỗi câu hỏi What / Where / When / Who / Why / How.</p>';
    wh.forEach(function(q,i){
      var opts=shuffle([{t:q[1],ok:1},{t:q[2][0],ok:0},{t:q[2][1],ok:0}],WR);
      h+='<div class="q wq" data-w="'+i+'"><div class="acts">'+spk(q[0],true)+'<b>'+(i+1)+'. '+esc(q[0])+'</b></div><div class="whopts">'+opts.map(function(o,j){return '<button class="btn" data-ok="'+o.ok+'"><span class="wl">'+"ABC"[j]+'</span> '+esc(o.t)+'</button>'}).join("")+'</div><div class="fbx"></div></div>'});
    h+='<div><button class="btn" id="whreset">🔁 Làm lại</button></div></div>';
  }
  var p=$("#p-story");p.innerHTML=h;
  $("#playall",p).onclick=function(){speakSequence($$(".sline",p),this)};
  var sc={};
  function upd(){var n=0;for(var k in sc)if(sc[k])n++;$("#ynscore").textContent="★ "+n+"/"+U.qs.length}
  $$(".q",p).forEach(function(qd){
    var i=+qd.getAttribute("data-i"),q=U.qs[i],done=false;
    $$("[data-a]",qd).forEach(function(b){b.onclick=function(){
      if(done)return;done=true;
      $$("[data-a]",qd).forEach(function(x){x.classList.remove("picked");x.disabled=true});b.classList.add("picked");
      var ok=b.getAttribute("data-a")===q[1];sc[i]=ok;upd();
      $(".fbx",qd).innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ Đúng rồi! ":"❌ Chưa đúng. ")+'<b>'+esc(q[2])+'</b><br>📖 “'+esc(q[3])+'”<br>💡 '+esc(q[4])+'</div>';
      speak(q[2]);
    }});
  });
  $("#ynreset",p).onclick=function(){stopAll();renderStory()};
  var ws={};
  function wupd(){var n=0;for(var k in ws)if(ws[k])n++;var e=$("#whscore");if(e)e.textContent="★ "+n+"/"+wh.length}
  $$(".wq",p).forEach(function(qd){
    var i=+qd.getAttribute("data-w"),q=wh[i],done=false;
    $$("[data-ok]",qd).forEach(function(b){b.onclick=function(){
      if(done)return;done=true;
      $$("[data-ok]",qd).forEach(function(x){x.disabled=true;if(x.getAttribute("data-ok")==="1")x.classList.add("right")});
      var ok=b.getAttribute("data-ok")==="1";ws[i]=ok;wupd();if(!ok)b.classList.add("bad");
      $(".fbx",qd).innerHTML='<div class="fb '+(ok?"ok":"no")+'">'+(ok?"✅ Đúng rồi! ":"❌ Chưa đúng. ")+'<b>'+esc(q[3])+'</b></div>';
      speak(q[3]);
    }});
  });
  var wr=$("#whreset",p);if(wr)wr.onclick=function(){stopAll();renderStory()};
}

/* ---------- 4 practice ---------- */
var PR={};
var NAMES="Minh Mary Lucy Ben Nam Mai Linh Hoa Rosie Ha Khoa Tony Laura Tom Bill Hung Peter Anna Akio Mia Sam Katie Jane John Jack Trang Lan Nga David Molly Lily Lucas Nancy Tim Ann Phong Mark Nick Phuc Duong Elena Mi Mr Mrs Ms Viet Nam Vietnamese English Ha Noi Hanoi Da Lat Hue Hoi An Tet Sunday Monday Tuesday Wednesday Thursday Friday Saturday January February March April May June July August September October November December".split(" ");
function properSet(){var s={};NAMES.forEach(function(n){s[n]=1});s.I=1;s["I'm"]=1;s["I'd"]=1;s["I'll"]=1;s["I've"]=1;
  allWords(U).forEach(function(w){w.en.split(/\s+/).forEach(function(t){if(/^[A-Z]/.test(t))s[t]=1})});
  var sents=allSents(U).map(function(x){return x.en}).concat(allWords(U).map(function(w){return w.ex}));
  sents.forEach(function(se){se.split(/\s+/).slice(1).forEach(function(t){t=t.replace(/[,.?!;:"]/g,"").replace(/'s$/,"");if(/^[A-Z][a-z]/.test(t))s[t]=1})});
  return s}
function normQ(s){s=" "+s.toLowerCase().replace(/[’‘]/g,"'").replace(/-/g," ")+" ";
  var rep=[["what's","what is"],["where's","where is"],["when's","when is"],["who's","who is"],["how's","how is"],["it's","it is"],["he's","he is"],["she's","she is"],["there's","there is"],["that's","that is"],["i'm","i am"],["they're","they are"],["you're","you are"],["we're","we are"],["i'd","i would"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["isn't","is not"],["aren't","are not"],["can't","cannot"],["can not","cannot"],["wasn't","was not"],["weren't","were not"],["won't","will not"],["shouldn't","should not"],["haven't","have not"],["hasn't","has not"]];
  rep.forEach(function(r){s=s.split(" "+r[0]+" ").join(" "+r[1]+" ");s=s.split(" "+r[0]+" ").join(" "+r[1]+" ")});
  return s.replace(/[^a-z0-9' ]/g," ").replace(/\s+/g," ").trim()}
function renderPractice(){
  PR={score:[0,0,0,0,0]};
  var words=allWords(U);
  var h='<div class="scorebar sticker"><span class="big" id="prtot">0/50</span><button class="btn pri" id="prnew" title="Xóa bài làm để làm lại từ đầu (câu hỏi giữ nguyên)">🔁 Làm lại từ đầu</button><div class="jump">'+["Nghe chọn từ","Trắc nghiệm","Nghe điền từ","Sắp xếp câu","Đặt câu hỏi"].map(function(t,i){return '<button class="btn" data-j="'+i+'">'+(i+1)+'. '+t+'</button>'}).join("")+'</div></div>';
  // B1
  var LR=seedRand("qec4-listen-u"+U.n+"-"+words.length);
  var b1=shuffle(words,LR).slice(0,10),used={};
  h+='<section class="ex-sec sticker" id="ex0"><h3>Bài 1 – Nghe và chọn từ</h3><p class="sub">Bấm 🔊 rồi chọn từ em nghe được.</p>';
  b1.forEach(function(w,i){used[w.en]=1;
    var ds=shuffle(words.filter(function(x){return x.en!==w.en&&x.em!==w.em}),LR),opts=[w],ems={};ems[w.em]=1;
    ds.forEach(function(d){if(opts.length<4&&!ems[d.em]){opts.push(d);ems[d.em]=1}});
    opts=shuffle(opts,LR);
    h+='<div class="item" data-k="0" data-ans="'+esc(w.en)+'"><div class="acts"><span class="num">'+(i+1)+'.</span>'+spk(w.en,false,0.7)+'</div><div class="opts">'+opts.map(function(o){return '<button class="opt" data-v="'+esc(o.en)+'"><span class="em">'+pic(o.em)+'</span>'+esc(o.en)+'</button>'}).join("")+'</div><div class="msg"></div></div>';
  });
  h+='</section>';
  // B2
  h+='<section class="ex-sec sticker" id="ex1"><h3>Bài 2 – Trắc nghiệm</h3><p class="sub">Chọn đáp án đúng điền vào chỗ trống.</p>';
  var R2=seedRand("qec4-b2-u"+U.n);
  shuffle(U.mcq,R2).slice(0,10).forEach(function(q,i){
    var opts=shuffle(q[1].map(function(o,j){return {t:o,ok:j===q[2]}}),R2);
    h+='<div class="item" data-k="1" data-full="'+esc(q[0].replace("___",q[1][q[2]]))+'" data-why="'+esc(q[3])+'"><div><span class="num">'+(i+1)+'.</span> '+esc(q[0])+'</div><div class="opts">'+opts.map(function(o){return '<button class="opt" data-ok="'+(o.ok?1:0)+'">'+esc(o.t)+'</button>'}).join("")+'</div><div class="msg"></div></div>';
  });
  h+='</section>';
  // B3
  var pool3=shuffle(words.filter(function(w){return wordRe(w.en).test(w.ex)}),LR);
  pool3=pool3.filter(function(w){return !used[w.en]}).concat(pool3.filter(function(w){return used[w.en]})).slice(0,10);
  h+='<section class="ex-sec sticker" id="ex2"><h3>Bài 3 – Nghe câu và điền từ</h3><p class="sub">Nghe cả câu, gõ từ còn thiếu.</p>';
  pool3.forEach(function(w,i){
    var parts=w.ex.replace(wordRe(w.en),function(m,a){return a+"\u0000"}).split("\u0000");
    h+='<div class="item" data-k="2" data-ans="'+esc(w.en)+'" data-full="'+esc(w.ex)+'"><div class="acts"><span class="num">'+(i+1)+'.</span>'+spk(w.ex,true,0.78)+'</div><div>'+esc(parts[0])+'<input class="gap" id="g'+cur+'-'+i+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Từ còn thiếu">'+esc(parts.slice(1).join(""))+'</div><div class="acts"><button class="btn chk">Kiểm tra</button><button class="btn show" hidden>👀 Xem đáp án</button><span class="msg"></span></div></div>';
  });
  h+='</section>';
  // B4
  var ps=properSet(),cands=[];
  U.structs.forEach(function(s){s.p.forEach(function(p){p[0].split(" – ").forEach(function(x){cands.push(x.trim())})})});
  words.forEach(function(w){cands.push(w.ex)});
  var seen={};cands=cands.filter(function(s){var n=s.split(/\s+/).length;if(seen[s]||n<4||n>9||/[.?!]\s/.test(s))return false;seen[s]=1;return true});
  h+='<section class="ex-sec sticker" id="ex3"><h3>Bài 4 – Sắp xếp câu</h3><p class="sub">Bấm các từ theo đúng thứ tự. Bấm từ ở ô trên để bỏ ra.</p>';
  var R4=seedRand("qec4-b4-u"+U.n);
  shuffle(cands,R4).slice(0,10).forEach(function(s,i){
    var t=s.replace(/[.?!]+$/,"").split(/\s+/);
    var f=t[0].replace(/,/g,"").replace(/'s$/,"");if(!ps[f])t[0]=t[0].charAt(0).toLowerCase()+t[0].slice(1);
    var sh=shuffle(t,R4);var tries=0;while(sh.join(" ")===t.join(" ")&&tries++<10)sh=shuffle(t,R4);
    h+='<div class="item" data-k="3" data-ans="'+esc(t.join(" "))+'" data-full="'+esc(s)+'"><div><span class="num">'+(i+1)+'.</span></div><div class="answer" aria-label="Câu của em"></div><div class="words">'+sh.map(function(x){return '<button class="wchip">'+esc(x)+'</button>'}).join("")+'</div><div class="acts"><button class="btn chk">Kiểm tra</button><button class="btn show" hidden>👀 Xem đáp án</button><span class="msg"></span></div></div>';
  });
  h+='</section>';
  // B5
  h+='<section class="ex-sec sticker" id="ex4"><h3>Bài 5 – Đặt câu hỏi cho câu trả lời</h3><p class="sub">Đọc câu trả lời rồi viết câu hỏi phù hợp.</p>';
  shuffle(U.qw,seedRand("qec4-b5-u"+U.n)).slice(0,10).forEach(function(q,i){
    h+='<div class="item" data-k="4" data-qs="'+esc(JSON.stringify(q[1]))+'"><div><span class="num">'+(i+1)+'.</span> Trả lời: <b>'+esc(q[0])+'</b></div><input class="tline" id="q'+cur+'-'+i+'" autocomplete="off" spellcheck="false" placeholder="Câu hỏi của em…" aria-label="Câu hỏi"><div class="acts"><button class="btn chk">Kiểm tra</button><button class="btn show" hidden>👀 Xem đáp án</button><span class="msg"></span></div></div>';
  });
  h+='</section>';
  var p=$("#p-practice");p.innerHTML=h;
  $("#prnew",p).onclick=function(){stopAll();renderPractice()};
  $$("[data-j]",p).forEach(function(b){b.onclick=function(){var t=$("#ex"+b.getAttribute("data-j"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})}});
  function addScore(k){PR.score[k]++;$("#prtot").textContent=PR.score.reduce(function(a,b){return a+b},0)+"/50"}
  function setMsg(it,ok,txt){var m=$(".msg",it);m.className="msg "+(ok?"ok":"no");m.innerHTML=txt}
  $$(".item",p).forEach(function(it){
    var k=+it.getAttribute("data-k"),wrong=0,done=false,shown=false;
    if(k===0){$$(".opt",it).forEach(function(b){b.onclick=function(){if(done)return;done=true;var a=it.getAttribute("data-ans"),ok=b.getAttribute("data-v")===a;
      $$(".opt",it).forEach(function(x){x.disabled=true;if(x.getAttribute("data-v")===a)x.classList.add("right")});
      if(ok){addScore(0);setMsg(it,true,"✅ Đúng rồi!")}else{b.classList.add("bad");setMsg(it,false,"❌ Đáp án: "+esc(a))}
      speak(a,{rate:0.7})}})}
    if(k===1){$$(".opt",it).forEach(function(b){b.onclick=function(){if(done)return;done=true;var ok=b.getAttribute("data-ok")==="1";
      $$(".opt",it).forEach(function(x){x.disabled=true;if(x.getAttribute("data-ok")==="1")x.classList.add("right")});
      if(ok)addScore(1);else b.classList.add("bad");
      setMsg(it,ok,(ok?"✅ Đúng rồi! ":"❌ Chưa đúng. ")+"<br>"+esc(it.getAttribute("data-full"))+"<br>💡 "+esc(it.getAttribute("data-why")));
      speak(it.getAttribute("data-full"))}})}
    if(k===3){var ans=$(".answer",it),wr=$(".words",it);
      wr.onclick=function(e){var c=e.target.closest(".wchip");if(!c||done)return;ans.appendChild(c)};
      ans.onclick=function(e){var c=e.target.closest(".wchip");if(!c||done)return;wr.appendChild(c)}}
    var chk=$(".chk",it),show=$(".show",it);
    if(!chk)return;
    function finish(ok){done=true;show.hidden=true;chk.disabled=true;$$("input",it).forEach(function(x){x.disabled=true})}
    chk.onclick=function(){if(done)return;var ok,empty=false;
      if(k===2){var g=$(".gap",it),v=g.value.trim();if(!v){empty=true}else{ok=v.toLowerCase()===it.getAttribute("data-ans").toLowerCase();g.classList.toggle("right",ok);g.classList.toggle("bad",!ok)}}
      if(k===3){if($(".words",it).children.length){empty=true}else{ok=$$(".answer .wchip",it).map(function(x){return x.textContent}).join(" ")===it.getAttribute("data-ans")}}
      if(k===4){var v4=$(".tline",it).value.trim();if(!v4){empty=true}else{var n=normQ(v4);ok=JSON.parse(it.getAttribute("data-qs")).some(function(a){return normQ(a)===n})}}
      if(empty){setMsg(it,false,"Em làm xong rồi bấm Kiểm tra nhé.");return}
      if(ok){if(!shown&&wrong===0)addScore(k);finish(true);
        var full=k===4?$(".tline",it).value.trim():it.getAttribute("data-full");
        setMsg(it,true,"✅ Đúng rồi! "+(k===3?"<br>"+esc(full):""));if(k!==3)speak(full)}

function footCanvas(text,wpx){var c=document.createElement("canvas");c.width=wpx;c.height=Math.round(wpx*0.03);var g=c.getContext("2d");
  g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.fillStyle="#8A6350";g.font="700 "+Math.round(c.height*0.55)+"px Nunito, system-ui, sans-serif";g.textBaseline="middle";
  g.fillText(text,0,c.height/2);return c}
function saveBlob(blob,fn){
  if(window.claude&&typeof window.claude.use==="function"){
    return window.claude.use("downloads").then(function(d){if(!d)return "unavailable";
      return d.save({filename:fn,data:blob}).then(function(){return "saved"},function(e){var c=e&&e.code;if(c==="declined")return "declined";if(c==="rate_limited")return "busy";return "unavailable"})},function(){return "unavailable"})}
  var a=document.createElement("a"),url=URL.createObjectURL(blob);a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000);return Promise.resolve("saved")}
var PDFBUSY=false;
function exportPDF(tabs,label){if(PDFBUSY)return;PDFBUSY=true;stopAll();
  var btns=[$("#pdfTab"),$("#pdfAll")];btns.forEach(function(b){b.disabled=true});pdfMsg("⏳ Đang chuẩn bị PDF…");
  var u=U,W=760,root=document.createElement("div");root.className="pdfroot";root.setAttribute("aria-hidden","true");
  var top=document.createElement("div");top.className="pdfsec";
  top.innerHTML='<div class="pdftop"><div><b>QUEEN ENGLISH CENTER</b><small>'+esc(BOOKNAME)+' · '+esc(LAB(u))+': '+esc(u.en)+' – '+esc(u.vi)+' · '+esc(label)+'</small></div><div class="nm">Họ tên: ……………………………</div></div>';
  root.appendChild(top);
  tabs.forEach(function(t){root.appendChild(buildSec(t,tabs.length>1))});
  document.body.appendChild(root);
  /* Story vừa tràn sang trang 2 một chút thì thu nhỏ nhẹ để gọn 1 trang */
  (function(){var PH0=760*(297-20)/192;$$(".pdfsec",root).forEach(function(sec){
    if(!sec.querySelector(".pstory"))return;var h=sec.getBoundingClientRect().height+(sec.classList.contains("pnew")?0:top.getBoundingClientRect().height);
    if(h>PH0&&h<PH0*1.3)sec.classList.add("tight")})})();
  function done(){root.remove();btns.forEach(function(b){b.disabled=false});PDFBUSY=false}
  var ready=(document.fonts&&document.fonts.ready)?document.fonts.ready:Promise.resolve();
  return Promise.all([needLibs(),ready]).then(function(){
    var secs=Array.prototype.slice.call(root.children),off=0,parts=[];
    secs.forEach(function(sec){var h=sec.getBoundingClientRect().height;parts.push({el:sec,off:off,h:h,pts:cutPoints(sec)});off+=h});
    var total=off,MX=9,MT=9,MB=11,PW=210-2*MX,PH=297-MT-MB,pageH=W*PH/PW;
    var all=[];parts.forEach(function(p){p.pts.forEach(function(y){all.push(p.off+y)});all.push(p.off)});all.sort(function(a,b){return a-b});
    var forced=parts.filter(function(p){return p.el.classList.contains("pnew")}).map(function(p){return p.off});
    var pages=[],a=0;while(a<total-2){var lim=a+pageH,fz=null;
      forced.forEach(function(y){if(fz===null&&y>a+2&&y<=lim)fz=y});
      if(fz!==null){pages.push([a,fz]);a=fz;continue}
      if(lim>=total){pages.push([a,total]);break}
      var best=null;all.forEach(function(y){if(y>a+pageH*0.6&&y<=lim)best=y});pages.push([a,best||lim]);a=best||lim}
    var S=2,i=0;
    function snapNext(){if(i>=parts.length)return Promise.resolve();var p=parts[i++];
      var sc=Math.min(S,Math.sqrt(14e6/(W*Math.max(p.h,1))));pdfMsg("⏳ Đang chụp phần "+i+"/"+parts.length+"…");
      return html2canvas(p.el,{scale:sc,backgroundColor:"#ffffff",useCORS:true,logging:false,windowWidth:Math.max(W+40,document.documentElement.clientWidth),scrollX:-window.scrollX,scrollY:-window.scrollY,
        onclone:function(d){d.documentElement.setAttribute("data-theme","light")}}).then(function(c){p.c=c;p.sc=sc;return snapNext()})}
    return snapNext().then(function(){
      var J=window.jspdf.jsPDF,pdf=new J({unit:"mm",format:"a4",orientation:"portrait",compress:true}),cw=Math.round(W*S);
      pages.forEach(function(pg,k){pdfMsg("⏳ Đang ghép trang "+(k+1)+"/"+pages.length+"…");
        var hpx=pg[1]-pg[0],cv=document.createElement("canvas");cv.width=cw;cv.height=Math.max(1,Math.round(hpx*S));var g=cv.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,cv.width,cv.height);
        parts.forEach(function(p){var s0=Math.max(pg[0],p.off),s1=Math.min(pg[1],p.off+p.h);if(s1<=s0)return;
          g.drawImage(p.c,0,(s0-p.off)*p.sc,p.c.width,(s1-s0)*p.sc,0,(s0-pg[0])*S,cw,(s1-s0)*S)});
        if(k)pdf.addPage();pdf.addImage(cv.toDataURL("image/jpeg",0.85),"JPEG",MX,MT,PW,PW*hpx/W);
        var fc=footCanvas("Queen English Center · "+BOOKNAME+" – "+LAB(u)+" · "+label+" · Trang "+(k+1)+"/"+pages.length,cw);
        pdf.addImage(fc.toDataURL("image/jpeg",0.9),"JPEG",MX,297-MB+3,PW,PW*fc.height/fc.width)});
      var blob=pdf.output("blob"),slug=label.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
      var fn="Queen-English-Center_TA4_"+(u.lab?u.lab:"Unit-"+(u.n<10?"0":"")+u.n)+"_"+slug+".pdf",np=pages.length;
      return saveBlob(blob,fn).then(function(r){pdfMsg(r==="saved"?"✅ Đã lưu PDF "+np+" trang.":r==="declined"?"Đã huỷ lưu PDF.":r==="busy"?"Đang có hộp thoại lưu mở, đợi chút rồi bấm lại nhé.":"⚠️ Không lưu được file ở đây.",r==="unavailable")})})
  }).catch(function(e){pdfMsg(e&&e.message==="load"?"⚠️ Cần có mạng để tải công cụ PDF lần đầu. Thử lại nhé.":"⚠️ Chưa xuất được PDF, thử lại nhé.",true)}).then(done)}
$("#pdfTab").onclick=function(){var t=TABS[tabIdx][0];if(PDFNAME[t])exportPDF([t],PDFNAME[t].replace(/^\S+\s/,""))};
$("#pdfAll").onclick=function(){exportPDF(["vocab","struct","story","mist"],"Tóm tắt bài học")};

buildChips();buildTabs();
var start=0,m=/^#u(\d+)$/.exec(location.hash||"");
if(m){UNITS.forEach(function(u,i){if(String(u.n)===m[1])start=i})}
else{try{var s=+localStorage.getItem("qec4-unit");if(s>=0&&s<UNITS.length)start=s}catch(e){}}
openUnit(start,false);
})();
